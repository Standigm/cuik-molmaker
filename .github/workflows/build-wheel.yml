# Builds the wheels consumers install, so that they need no build toolchain of their own.
#
# The build runs inside a manylinux container and the wheels carry a manylinux platform tag,
# so pip refuses one on a host older than the glibc it was built for rather than letting the
# dynamic loader fail at import. ci/build-wheel.sh holds the actual steps and runs by hand in
# the same container, so a maintainer can verify exactly what this job publishes.
name: build wheel

on:
  workflow_dispatch:
    inputs:
      rdkit_version:
        description: RDKit version to build and link against
        default: "2026.03.4"
  push:
    tags:
      - "v*"

env:
  RDKIT_VERSION: ${{ inputs.rdkit_version || '2026.03.4' }}

jobs:
  build:
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64
    strategy:
      fail-fast: false
      matrix:
        py_tag: [cp311, cp312, cp313]
    steps:
      - uses: actions/checkout@v4

      - name: Build, audit and test
        run: SRC="$GITHUB_WORKSPACE" OUT="$GITHUB_WORKSPACE/dist" bash ci/build-wheel.sh ${{ matrix.py_tag }}

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.py_tag }}
          path: dist/*manylinux*.whl

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist

      # Consumers pin by URL and digest, so publish the digests next to the wheels.
      - name: Record digests
        run: cd dist && sha256sum *.whl | tee SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/SHA256SUMS
